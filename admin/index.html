<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>读中记 · 站群后台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <!-- 登录 -->
    <section id="login-view" class="panel login" hidden>
      <div class="brand">
        <span class="mark">记</span>
        <div>
          <h1>站群后台</h1>
          <p class="muted">读中记 · 所有站点一处看</p>
        </div>
      </div>
      <form id="login-form" class="stack">
        <label>邮箱<input id="email" type="email" autocomplete="username" required /></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" required /></label>
        <p id="login-error" class="error" hidden></p>
        <button id="login-btn" class="primary" type="submit">登录</button>
      </form>
      <p class="muted small">管理员就是读中记里第一个注册的账号。</p>
    </section>

    <!-- 后台 -->
    <section id="app-view" hidden>
      <header class="topbar">
        <div class="brand">
          <span class="mark">记</span>
          <div>
            <h1>站群后台</h1>
            <p class="muted" id="whoami"></p>
          </div>
        </div>
        <button id="logout" class="ghost" type="button">退出</button>
      </header>

      <div id="stats" class="stats"></div>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="sites">站点</button>
        <button class="tab" data-tab="users">用户</button>
        <button class="tab" data-tab="add">新增站点</button>
      </nav>

      <div id="view" class="view"></div>
      <p class="muted small footer">
        新增网站后，把页面给出的上报代码贴进那个网站即可；访问量会自动出现在这里，
        不需要再改后台。
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
