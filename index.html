<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/duzhongji-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="duzhongji">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>duzhongji</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // This machine cannot reach gstatic.com, where Flutter fetches CanvasKit by
    // default, so the app renders a blank page: the engine never starts.
    //
    // flutter_bootstrap.js assigns window._flutter.buildConfig at its own end,
    // and its loader prefers the CDN whenever a build config is present. This
    // script runs after that assignment (async script ordering aside, the
    // bootstrap defines the object synchronously before loading main.dart.js),
    // so it re-points the renderer at the copy the build already put in
    // build/web/canvaskit.
    (function pointCanvasKitAtLocalCopy() {
      function patch() {
        if (!window._flutter || !window._flutter.buildConfig) return false;
        window._flutter.buildConfig.useLocalCanvasKit = true;
        window._flutter.buildConfig.canvasKitBaseUrl = "canvaskit/";
        return true;
      }
      if (patch()) return;
      // The bootstrap is async; retry briefly until it has run.
      var tries = 0;
      var timer = setInterval(function () {
        if (patch() || ++tries > 200) clearInterval(timer);
      }, 10);
    })();
  </script>
</body>
</html>
