<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/duzhongji-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="duzhongji">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!--
    The engine asks fonts.gstatic.com for Roboto on every cold start, even
    though every text style in the app names a bundled family. That request
    sits in front of the first frame and, on this network, often fails after a
    long timeout. The app ships its own Roboto, so the external copy is refused
    instead of waited for.

    Only `font-src` is restricted: network access for the user's own AI endpoint
    must stay open, so nothing else is declared here.
  -->
  <meta http-equiv="Content-Security-Policy" content="font-src 'self' data:">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>读中记 · 背单词</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Start the heavy downloads while the bootstrap is still being parsed.
    Without this the browser only discovers main.dart.js after flutter.js has
    run, which serialises two multi-megabyte fetches and pushes first paint
    past five seconds on a domestic connection.
  -->
  <!--
    No preload for main.dart.js: the bootstrap fetches it itself and the
    crossorigin hint made the browser issue a second, separate request for the
    same 3 MB file (measured: two entries, 4.3 s and 4.2 s). The bootstrap is
    parsed in the same tick, so the head start was worth nothing anyway.
  -->
  <link rel="preload" href="canvaskit/chromium/canvaskit.wasm" as="fetch"
        type="application/wasm" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Deng.ttf" as="font"
        type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/roboto-regular.ttf" as="font"
        type="font/ttf" crossorigin>

  <style>
    /*
      Flutter paints nothing until the engine is up, so the browser would show
      a blank white page for seconds. This splash paints on the first HTML
      parse and is removed once Flutter reports its first frame.
    */
    html, body { margin: 0; height: 100%; }
    body { background: #FDF6EA; }
    #dzj-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(170deg, #FDF6EA 0%, #F7E2C3 100%);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      transition: opacity 260ms ease; z-index: 9999;
    }
    #dzj-splash.done { opacity: 0; pointer-events: none; }
    #dzj-splash svg { width: 84px; height: 84px; }
    #dzj-splash .name {
      font-size: 21px; letter-spacing: 5px; color: #6B5B47; font-weight: 500;
    }
    #dzj-splash .hint {
      font-size: 12.5px; color: #A6967F; letter-spacing: 1px;
    }
    #dzj-splash .bar {
      width: 132px; height: 3px; border-radius: 2px;
      background: rgba(194,120,43,0.16); overflow: hidden;
    }
    #dzj-splash .bar i {
      display: block; height: 100%; width: 40%; border-radius: 2px;
      background: #C2782B; animation: dzj-slide 1.15s ease-in-out infinite;
    }
    @keyframes dzj-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #dzj-splash .bar i { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="dzj-splash">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 8c11 6 18 15 18 24S42 52 32 56C22 52 14 41 14 32S21 14 32 8z"
            fill="#C2782B"/>
      <path d="M32 14v38" stroke="#FDF6EA" stroke-width="2.6"
            stroke-linecap="round"/>
    </svg>
    <div class="name">读中记</div>
    <div class="bar"><i></i></div>
    <div class="hint">正在加载词库…</div>
  </div>
  <script>
    // Remove the splash on Flutter's first frame. The event fires from the
    // engine; the timeout is a safety net so a failed boot still reveals the
    // error page instead of sitting on the splash forever.
    (function hideSplashWhenReady() {
      var splash = document.getElementById('dzj-splash');
      if (!splash) return;
      function hide() {
        if (!splash || splash.classList.contains('done')) return;
        splash.classList.add('done');
        setTimeout(function () { splash.remove(); }, 320);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 12000);
    })();

    // Register the offline cache. Flutter's own worker is disabled by the
    // build, so this is the only thing making repeat visits instant.
    //
    // Registered here, during parsing, not on `load`: waiting for load meant
    // the worker was not even installing while the app booted, so the first
    // visit cached nothing and the *second* visit was still uncontrolled
    // (measured: 22.6 s then 4.1 s, worker only active on visit 3).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('dzj-sw.js').catch(function (e) {
        console.warn('offline cache unavailable:', e);
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    CanvasKit must come from this origin, not gstatic: that host is blocked on
    this network and the page would stay blank.

    The loader builds its URL as
        (buildConfig.canvasKitBaseUrl ?? "https://www.gstatic.com/flutter-canvaskit/<rev>/") + path
    inside main.dart.js. The bootstrap assigns buildConfig before it loads
    main.dart.js, so a *setter* installed on window._flutter catches that
    assignment and pins the base URL from the very first read. Doing the same
    patch after the bootstrap had already run left one gstatic attempt in the
    timeline (measured), which cost a round trip before the first frame.
  -->
  <script>
    (function pinCanvasKitToThisOrigin() {
      var base = new URL("canvaskit/", document.baseURI).href;
      // The bootstrap does `window._flutter || (window._flutter = {})` and then
      // assigns buildConfig. A getter that returned a fresh object each read
      // broke that contract and the app never loaded, so this keeps one plain
      // object and just polls until buildConfig appears.
      window._flutter = window._flutter || {};
      var ticks = 0;
      var timer = setInterval(function () {
        var b = window._flutter && window._flutter.buildConfig;
        if (b) {
          b.canvasKitBaseUrl = base;
          b.useLocalCanvasKit = true;
          if (window._flutter.loader) clearInterval(timer);
        }
        if (++ticks > 600) clearInterval(timer);
      }, 5);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
